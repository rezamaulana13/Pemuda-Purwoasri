<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#e11d48" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Base Background -->
  <rect width="100" height="100" rx="24" fill="url(#redGrad)" filter="url(#glow)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Outer Gold Laurel / Energy Ring -->
  <circle cx="50" cy="50" r="36" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85"/>
  
  <!-- Emblem Shield / Diamond -->
  <polygon points="50,16 78,36 70,74 50,86 30,74 22,36" fill="url(#shieldGrad)" />
  <polygon points="50,19 75,37 68,72 50,83 32,72 25,37" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Youth Flame / Obor Pemuda Semangat Merah Putih & Emas -->
  <!-- Left Wing Flame -->
  <path d="M50 25 C45 35 34 45 35 60 C36 70 43 75 50 78 C44 72 43 62 46 54 C48 48 50 36 50 25 Z" fill="#e11d48"/>
  <!-- Right Wing Flame -->
  <path d="M50 25 C55 35 66 45 65 60 C64 70 57 75 50 78 C56 72 57 62 54 54 C52 48 50 36 50 25 Z" fill="#be123c"/>
  <!-- Core Golden Flame -->
  <path d="M50 32 C47 40 42 47 43 57 C44 65 48 69 50 72 C52 69 56 65 57 57 C58 47 53 40 50 32 Z" fill="url(#goldGrad)"/>
  <!-- Center Star of Excellence -->
  <polygon points="50,45 52.5,51.5 59,52 54,56.5 55.5,63 50,59 44.5,63 46,56.5 41,52 47.5,51.5" fill="#ffffff"/>
</svg>
