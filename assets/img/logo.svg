<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e11d48" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem Icon Box -->
  <g transform="translate(10, 8)" filter="url(#logoShadow)">
    <rect width="64" height="64" rx="16" fill="url(#logoRedGrad)" />
    <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    
    <!-- Outer Gold Ring -->
    <circle cx="32" cy="32" r="23" stroke="url(#logoGoldGrad)" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.9"/>
    
    <!-- Shield -->
    <polygon points="32,10 50,23 45,47 32,55 19,47 14,23" fill="#ffffff" />
    
    <!-- Flame Motif -->
    <path d="M32 16 C29 22 22 29 23 38 C24 45 28 48 32 50 C28 46 27 40 29 35 C31 31 32 23 32 16 Z" fill="#e11d48"/>
    <path d="M32 16 C35 22 42 29 41 38 C40 45 36 48 32 50 C36 46 37 40 35 35 C33 31 32 23 32 16 Z" fill="#be123c"/>
    <path d="M32 21 C30 26 27 31 28 37 C29 42 31 44 32 46 C33 44 35 42 36 37 C37 31 34 26 32 21 Z" fill="url(#logoGoldGrad)"/>
    <polygon points="32,29 33.5,33.5 38,34 34.5,37 35.5,41.5 32,39 28.5,41.5 29.5,37 26,34 30.5,33.5" fill="#ffffff"/>
  </g>

  <!-- Text Typography -->
  <text x="88" y="38" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
    Pemuda <tspan fill="#e11d48">Purwoasri</tspan>
  </text>
  <text x="88" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="1.5">
    TEGALDLIMO <tspan fill="#94a3b8">•</tspan> BANYUWANGI
  </text>
</svg>
